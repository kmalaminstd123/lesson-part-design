<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- bootstrap cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <!-- bootstrap cdn -->

    <!-- fontwesom cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- fontwesom cdn -->


    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <title>Document</title>
</head>

  <!-- lesson part start -->

  <div class="container">

    <div class="lesson">

      <div class="row">

        <div class="col-md-8 col-sm-12">

          <div class="lesson-greet-card shadow-sm">
            <div class="row g-0">
              <div class="col-md-7 col-sm-12">
                <img src="./images/mba-program-img.jpeg" class="lesson-greet-img rounded-start" alt="Program Image">
              </div>
              <div class="col-md-5 col-sm-12 d-flex align-items-center">
                <div class="lesson-text px-4 py-3">
                  <h2 class="lession-card-heading">Master of Social Science in Human Rights & Gender Studies (MSSHRGS)</h2>
                  <p class="lesson-subhead">Empowering future leaders in justice, equality, and social impact.</p>
                </div>
              </div>
            </div>
          </div>

          <div class="lesson-download-list">

            <div class="row">

              <div class="col-md-12 col-sm-12 mt-5 d-flex justify-content-center gap-1">

                <!-- download card -->

                <button type="button" class="btn border mod-dn-btn" data-bs-toggle="modal"
                  data-bs-target="#requestInfoModal">
                  <i class="fa-solid fa-circle-info"></i> Request Info
                </button>

                <button type="button" class="btn border mod-dn-btn" data-bs-toggle="modal"
                  data-bs-target="#downloadBrochureModal">
                  <i class="fa-solid fa-circle-down"></i> Download Brochure
                </button>

              </div>


            </div>

          </div>

        </div>

        <div class="col-md-4 col-sm-12">

          <div class="lesson-list-card card bg-transparent rounded border-0 px-3">

            <div class="card-header bg-transparent px-0">
              <h3 class="feature-heading">Features of the Programme</h3>
            </div>
          
            <div class="card-body">
          
              <!-- Single Feature -->
              <div class="row lesson-main-list rounded align-items-center mb-3 py-2">
                <div class="col-3">
                  <div class="lesson-list-icon">
                    <i class="fa-solid fa-money-check-dollar"></i>
                  </div>
                </div>
                <div class="col-9">
                  <p class="feature-title">Regular Fee</p>
                  <h4 class="feature-info"><i class="fa-solid fa-euro-sign"></i> 1999.00</h4>
                </div>
              </div>
          
              <!-- Single Feature -->
              <div class="row lesson-main-list rounded align-items-center mb-3 py-2">
                <div class="col-3">
                  <div class="lesson-list-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                  </div>
                </div>
                <div class="col-9">
                  <p class="feature-title">Partial Scholarship</p>
                  <h4 class="feature-info">Available</h4>
                </div>
              </div>
          
              <!-- Single Feature -->
              <div class="row lesson-main-list rounded align-items-center mb-3 py-2">
                <div class="col-3">
                  <div class="lesson-list-icon">
                    <i class="fa-solid fa-calendar-days"></i>
                  </div>
                </div>
                <div class="col-9">
                  <p class="feature-title">Intake</p>
                  <h4 class="feature-info">Monthly Intake</h4>
                </div>
              </div>
          
              <!-- Single Feature -->
              <div class="row lesson-main-list rounded align-items-center mb-3 py-2">
                <div class="col-3">
                  <div class="lesson-list-icon">
                    <i class="fa-solid fa-clock"></i>
                  </div>
                </div>
                <div class="col-9">
                  <p class="feature-title">Programme Duration</p>
                  <h4 class="feature-info">12 to 18 Months</h4>
                </div>
              </div>
          
              <!-- Single Feature -->
              <div class="row lesson-main-list rounded align-items-center mb-3 py-2">
                <div class="col-3">
                  <div class="lesson-list-icon">
                    <i class="fa-solid fa-message"></i>
                  </div>
                </div>
                <div class="col-9">
                  <p class="feature-title">Live Chat</p>
                  <h4 class="feature-info">Available</h4>
                </div>
              </div>
          
            </div>
          </div>
          

        </div>

      </div>

    </div>

  </div>

  <!-- lession part end -->

</body>

</html>
